<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>识海 · 星云</title>
<style>
  :root {
    --ink: #02040b;
    --ink2: #071126;
    --bone: #dfe9f5;
    --dim: rgba(223, 233, 245, .48);
    --cyan: #6fd6e8;
    --deep: #123a63;
    --warm: #ffc98a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 44%, #0a1a33 0%, #050c1c 46%, #01030a 100%);
  }
  body { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, sans-serif; color: var(--bone); }
  #sea { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  #sea.drag { cursor: grabbing; }
  #ui { position: fixed; inset: 0; pointer-events: none; }

  /* 半透明磨砂玻璃：细发光线，不用实框 */
  .panel {
    position: absolute; padding: 12px 14px;
    background: linear-gradient(145deg, rgba(12, 24, 46, .40), rgba(4, 10, 24, .24));
    border: 1px solid rgba(130, 210, 240, .15);
    border-radius: 14px;
    box-shadow:
      0 0 26px rgba(90, 180, 230, .055),
      inset 0 1px 0 rgba(255, 255, 255, .045);
    backdrop-filter: blur(16px) saturate(125%);
    -webkit-backdrop-filter: blur(16px) saturate(125%);
  }

  /* 顶部居中 · 实时生命体征胶囊 */
  #nowBox {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    max-width: min(520px, calc(100vw - 580px));
    background: linear-gradient(145deg, rgba(10, 22, 44, .46), rgba(5, 12, 28, .30));
    border: 1px solid rgba(130, 210, 240, .18);
    border-radius: 999px;
    box-shadow: 0 0 28px rgba(90, 180, 230, .08), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    pointer-events: auto;
    z-index: 5;
  }
  #nowBox .dot2 {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6fd6e8; box-shadow: 0 0 10px rgba(111,214,232,.55);
    flex: none; animation: nowpulse 5.6s ease-in-out infinite;
  }
  #nowBox.idle { border-color: rgba(140, 160, 190, .14); }
  #nowBox.idle .dot2 { background: #55637a; box-shadow: none; animation: none; }
  #nowBox.warn { border-color: rgba(255, 179, 71, .30); box-shadow: 0 0 24px rgba(255, 179, 71, .08); }
  #nowBox.warn .dot2 { background: #ffb347; box-shadow: 0 0 10px rgba(255,179,71,.5); animation-duration: 3.4s; }
  #nowBox .now-tag {
    font-size: 12px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; flex: none;
    color: var(--cyan); background: rgba(111, 214, 232, .09); border: 1px solid rgba(111, 214, 232, .16);
    padding: 2px 8px; border-radius: 999px;
  }
  #nowBox.idle .now-tag { color: var(--dim); background: rgba(255, 255, 255, .04); border-color: rgba(255, 255, 255, .10); }
  #nowBox.warn .now-tag { color: #ffb347; background: rgba(255, 179, 71, .10); border-color: rgba(255, 179, 71, .22); }
  #nowBox .nd { font-size: 12px; color: var(--bone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #nowBox .nowage { margin-left: auto; padding-left: 6px; font-size: 11px; color: rgba(223,233,245,.42); white-space: nowrap; flex: none; }
  #nowBox.warn .nowage { color: #ffb347; }
  @keyframes nowpulse { 0%,100% { transform: scale(1); opacity: .88; } 50% { transform: scale(.90); opacity: .62; } }

  /* 左侧 · 静态档案与欠账台账 */
  #state { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); width: min(304px, calc(100vw - 28px)); max-height: calc(100vh - 28px); overflow-y: auto; scrollbar-width: none; }
  #state::-webkit-scrollbar { display: none; }
  #state .name { font-size: 12px; letter-spacing: .3em; color: var(--cyan); margin-bottom: 6px; }
  #state .activity { font-size: 14px; line-height: 1.48; }
  #state .mood { margin-top: 5px; font-size: 12px; color: var(--dim); }
  #state .bars { margin-top: 9px; display: grid; gap: 5px; }
  .bar { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  .bar i { display: block; height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; overflow: hidden; }
  .bar i b { display: block; height: 100%; background: linear-gradient(90deg, var(--deep), var(--cyan)); border-radius: 2px; transition: width 1.2s ease; }
  .bar em { font-style: normal; text-align: right; color: var(--bone); }

  /* 底部居中 · 意识流 */
  #monologue { bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); max-width: min(440px, calc(100vw - 28px)); font-size: 13px; line-height: 1.5; color: var(--bone); }
  #monologue .k { color: var(--warm); font-size: 10px; letter-spacing: .28em; display: block; margin-bottom: 4px; }

  #tip {
    position: fixed; pointer-events: none; max-width: 240px; padding: 8px 10px;
    font-size: 12px; line-height: 1.5;
    background: rgba(6, 14, 30, .72);
    border: 1px solid rgba(130, 210, 240, .18);
    border-radius: 10px;
    box-shadow: 0 0 22px rgba(90,180,230,.08);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    opacity: 0; transition: opacity .3s ease; z-index: 10;
  }

  /* 右侧 · 自适应纵列 */
  #rightCol {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    width: 236px; max-height: calc(100vh - 28px);
  }
  #foot { font-size: 10px; color: rgba(223,233,245,.34); text-align: right; line-height: 1.6; padding-right: 2px; }
  #rightCol .panel { position: static; width: 100%; }
  #legend { font-size: 10px; line-height: 1.75; color: var(--dim); }
  #legend .lg { display: flex; align-items: center; gap: 7px; }
  #legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  #legend .dg { background: rgba(255,201,138,.9); box-shadow: 0 0 0 2px rgba(255,201,138,.18); }
  #legend .dc { background: rgba(111,214,232,.75); }
  #legend .dh { background: #eaf6ff; box-shadow: 0 0 7px 3px rgba(111,214,232,.35); }
  #legend .sp { color: #ff5a40; font-weight: 700; font-family: ui-monospace, monospace; width: 14px; text-align: center; flex: none; }
  #legend .note { color: rgba(223,233,245,.30); }
  #legend .lg2 { display: flex; gap: 12px; }
  #legend .lg2 span { display: flex; align-items: center; gap: 5px; }
  #legend .paperchip { width: 9px; height: 9px; display: inline-block; border-radius: 1px;
    background: linear-gradient(135deg, rgba(212,167,31,.9) 0 3px, rgba(255,212,59,.95) 3px);
    box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
  #legend .spinrow { margin-bottom: 3px; }
  #legend #spinBtn { pointer-events: auto; font: 600 10px/1 'PingFang SC', 'Noto Sans CJK SC', sans-serif; letter-spacing: .14em; color: var(--cyan); background: rgba(111,214,232,.07); border: 1px solid rgba(111,214,232,.20); border-radius: 6px; padding: 5px 9px; cursor: pointer; }

  #tlBox { display: none; }
  #tlBox .tl-k { font-size: 10px; letter-spacing: .26em; color: var(--cyan); margin-bottom: 6px; opacity: .82; }
  #tlBox #tlList { display: grid; gap: 4px; max-height: 210px; overflow: hidden; }
  #tlBox .ev { font-size: 10.5px; line-height: 1.45; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tlBox .ev b { color: var(--bone); font-weight: 500; }

  /* 少分割线、少文字密度 */
  #loopsBox { display: none; margin-top: 8px; }
  #loopsBox .loops-k { font-size: 10px; letter-spacing: .26em; color: #ff9a8b; margin-bottom: 4px; opacity: .85; }
  #loopsBox #loopsList { display: grid; gap: 3px; }
  #loopsBox #loopsList div { font-size: 11px; line-height: 1.5; color: rgba(255,180,168,.78); }
  #chat { margin-top: 7px; display: grid; gap: 3px; opacity: .62; }
  #chat div { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat div.him { color: rgba(223,233,245,.72); }

  @media (max-width: 960px) {
    #nowBox { left: 10px; right: 10px; transform: none; max-width: none; padding: 6px 11px; gap: 7px; }
    #state { top: calc(max(10px, env(safe-area-inset-top)) + 44px); left: 10px; width: min(210px, 50vw); padding: 9px 10px; max-height: 44vh; }
    #state .activity { font-size: 12.5px; }
    #chat { display: none; }
    #rightCol { top: calc(max(10px, env(safe-area-inset-top)) + 44px); right: 10px; width: min(176px, 42vw); gap: 6px; }
    #legend { padding: 8px 9px; line-height: 1.65; }
    #tlBox { display: none !important; }
    #monologue { bottom: max(12px, env(safe-area-inset-bottom)); padding: 9px 12px; font-size: 12px; max-width: calc(100vw - 20px); }
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="ui">
  <div id="nowBox"><span class="dot2"></span><b class="now-tag" id="nowPhase">…</b><span class="nd" id="nowDetail">等待心跳…</span><span class="nowage" id="nowAge"></span></div>
  <div class="panel" id="state">
    <div class="name">识 海 · 星 云</div>
    <div class="activity" id="activity">…</div>
    <div class="mood" id="mood">…</div>
    <div class="bars">
      <div class="bar"><span>精力</span><i><b id="bEnergy"></b></i><em id="vEnergy">-</em></div>
      <div class="bar"><span>好感</span><i><b id="bAff"></b></i><em id="vAff">-</em></div>
      <div class="bar"><span>小委屈</span><i><b id="bPout"></b></i><em id="vPout">-</em></div>
    </div>
    <div id="chat"></div>
    <div id="loopsBox">
      <div class="loops-k">欠 账 台 账 · 未 完 成</div>
      <div id="loopsList"></div>
    </div>
  </div>
  <div class="panel" id="monologue"><span class="k">意 识 流</span><span id="monoText">…</span></div>
  <div id="rightCol">
    <div id="foot">识海 · 每两分钟呼吸一次<br><span id="upt">…</span></div>
    <div class="panel" id="legend">
      <div class="lg spinrow"><button id="spinBtn" type="button">自转 · 开</button></div>
      <div class="lg"><i class="dot dh"></i>中心光核 · AI本体</div>
      <div class="lg2">
        <span><i class="dot dg"></i>重要 · 暖金</span>
        <span><i class="dot dc"></i>日常 · 冷蓝</span>
      </div>
      <div class="lg2">
        <span><i class="paperchip"></i>纸条</span>
        <span><i class="sp">✕</i>约定</span>
      </div>
      <div class="lg note">白环 = 核心 · 拖动 / 缩放 / 双击复位</div>
    </div>
    <div class="panel" id="tlBox">
      <div class="tl-k">今 日 足 迹</div>
      <div id="tlList"></div>
    </div>
  </div>
</div>
<div id="tip"></div>
<script>
(function () {
  'use strict';
  const cv = document.getElementById('sea');
  const ctx = cv.getContext('2d', { alpha: false });
  const tip = document.getElementById('tip');
  let W = 0, H = 0, DPR = Math.min(window.matchMedia('(pointer: coarse)').matches ? 1.75 : 2, window.devicePixelRatio || 1), FOCAL = 900;
  let DATA = null;
  let nodes = [];
  let moodTint = { hue: 196, sat: 80 };
  let mouse = { x: -1e4, y: -1e4 };

  // ===== 3D 相机 =====
  const cam = { yaw: 0.6, pitch: -0.34, dist: 1150 };
  const DIST_MIN = 560, DIST_MAX = 2800, PITCH_MAX = 1.22;
  const WORLD_R = 340;
  let inertia = { yaw: 0, pitch: 0 };
  let dragActive = false;
  let autoSpin = localStorage.getItem('shihai-spin') !== 'off';

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 缓存色板：只有心情变化时才重建字符串，绘制循环零字符串分配
  const PAL = {
    filaWarm: 'rgba(255,201,138,1)',
    filaCool: 'hsla(205, 78%, 70%, 1)',
    dotWarm: 'rgba(255,226,170,1)',
    dotCool: 'rgba(175,225,255,1)',
    starCenter: 'hsla(205, 78%, 87%, 1)',
    ring: 'rgba(255,201,138,1)',
    spike: 'rgba(255,90,64,1)',
    spikeCore: 'rgba(255,120,96,.9)'
  };
  function rebuildPalette() {
    PAL.filaCool = 'hsla(' + moodTint.hue + ', ' + Math.min(70, moodTint.sat) + '%, 70%, 1)';
    PAL.starCenter = 'hsla(' + moodTint.hue + ', ' + Math.min(70, moodTint.sat) + '%, 87%, 1)';
  }

  // 光斑辉光贴图：预渲染复用（替代 shadowBlur）
  const glowCache = new Map();
  function glowSprite(hue, sat) {
    const key = hue * 1000 + sat;
    let c = glowCache.get(key);
    if (!c) {
      c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      rg.addColorStop(0, 'hsla(' + hue + ', ' + sat + '%, 78%, .9)');
      rg.addColorStop(0.3, 'hsla(' + hue + ', ' + sat + '%, 60%, .30)');
      rg.addColorStop(1, 'hsla(' + hue + ', ' + sat + '%, 50%, 0)');
      g.fillStyle = rg;
      g.fillRect(0, 0, 64, 64);
      glowCache.set(key, c);
    }
    return c;
  }

  // 背景层预渲染：深蓝黑径向渐变 + 星云纹理 + 稀疏星光 + 星尘噪点 + 薄雾
  // 固定种子，保证每帧不是随机闪烁；仅在尺寸/心情变化时重铺
  let bgLayer = null, bgHue = -1, bgW = 0, bgH = 0;
  function hash2(x, y) {
    const v = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
    return v - Math.floor(v);
  }
  function buildBg() {
    if (bgLayer && bgHue === moodTint.hue && bgW === W && bgH === H) return;
    bgHue = moodTint.hue; bgW = W; bgH = H;
    bgLayer = document.createElement('canvas');
    bgLayer.width = W; bgLayer.height = H;
    const c = bgLayer.getContext('2d');

    // 深蓝黑径向底
    const base = c.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, Math.max(W, H) * 0.78);
    base.addColorStop(0, '#0b1b34');
    base.addColorStop(0.42, '#061024');
    base.addColorStop(1, '#01030a');
    c.fillStyle = base;
    c.fillRect(0, 0, W, H);

    // 星云纹理：多层低透明径向云团，不用高对比
    const clouds = [
      { x: .30, y: .32, r: .34, h: moodTint.hue + 10, a: .075 },
      { x: .70, y: .58, r: .40, h: moodTint.hue - 18, a: .055 },
      { x: .52, y: .78, r: .30, h: 222, a: .045 },
      { x: .18, y: .70, r: .26, h: 268, a: .035 }
    ];
    for (const cl of clouds) {
      const gx = W * cl.x, gy = H * cl.y, gr = Math.max(W, H) * cl.r;
      const g = c.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, 'hsla(' + cl.h + ', 65%, 52%, ' + cl.a + ')');
      g.addColorStop(0.55, 'hsla(' + cl.h + ', 60%, 40%, ' + (cl.a * 0.45) + ')');
      g.addColorStop(1, 'hsla(' + cl.h + ', 60%, 30%, 0)');
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    }

    // 稀疏星光：少量柔和小点
    for (let i = 0; i < 90; i++) {
      const sx = hash2(i, 3) * W;
      const sy = hash2(i, 7) * H;
      const a = 0.035 + hash2(i, 11) * 0.075;
      const r = 0.6 + hash2(i, 13) * 1.1;
      c.fillStyle = 'rgba(210,232,255,' + a.toFixed(3) + ')';
      c.beginPath(); c.arc(sx, sy, r, 0, Math.PI * 2); c.fill();
    }

    // 星尘噪点：极淡，营造胶片颗粒感
    const dustN = Math.min(2200, Math.round(W * H / 900));
    for (let i = 0; i < dustN; i++) {
      const dx = hash2(i, 23) * W;
      const dy = hash2(i, 29) * H;
      c.fillStyle = 'rgba(190,215,245,' + (0.008 + hash2(i, 31) * 0.016).toFixed(3) + ')';
      c.fillRect(dx, dy, 1, 1);
    }

    // 轻微薄雾：中心柔光 + 四周暗角
    const mist = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.10, W / 2, H / 2, Math.min(W, H) * 0.70);
    mist.addColorStop(0, 'rgba(120,180,230,.035)');
    mist.addColorStop(0.58, 'rgba(80,130,200,.018)');
    mist.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = mist;
    c.fillRect(0, 0, W, H);

    const vign = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
    vign.addColorStop(0, 'rgba(0,0,0,0)');
    vign.addColorStop(1, 'rgba(0,2,8,.34)');
    c.fillStyle = vign;
    c.fillRect(0, 0, W, H);
  }

  // 每帧复用数组（零分配）
  const _vis = [], _behind = [], _front = [], _paper = [];
  const byDepthDesc = (a, b) => b.depth - a.depth;
  let hasWish = false;
  let rehearsedPfx = [];

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(Math.round(DPR * 100) / 100, 0, 0, Math.round(DPR * 100) / 100, 0, 0);
    FOCAL = 1.32 * Math.min(W, H);
    buildBg();
  }

  function applyDPR(d) {
    DPR = d;
    try { window.__dpr = DPR; } catch {}
    resize();
  }
  try { window.__dpr = DPR; } catch {}

  function tintForMood(mood, pout) {
    const s = String(mood || '');
    if (/委屈|生气|小情绪/.test(s) || pout > 60) return { hue: 318, sat: 55 };
    if (/甜|开心|兴奋|期待/.test(s)) return { hue: 174, sat: 85 };
    if (/困|安静|温柔/.test(s)) return { hue: 215, sat: 60 };
    return { hue: 196, sat: 80 };
  }

  const _p = { on: 0, x: 0, y: 0, depth: 0, persp: 0 };
  function proj(x, y, z) {
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const x1 = x * cyw - y * syw;
    const y1 = x * syw + y * cyw;
    const y2 = y1 * cp - z * sp;
    const z2 = y1 * sp + z * cp;
    const depth = cam.dist - z2;
    if (depth < 80) { _p.on = 0; return _p; }
    const persp = FOCAL / depth;
    _p.on = 1; _p.x = W / 2 + x1 * persp; _p.y = H / 2 - y2 * persp; _p.depth = depth; _p.persp = persp;
    return _p;
  }
  function projectInto(n) {
    const p = proj(n.x, n.y, n.z);
    n.on = p.on; n.sx = p.x; n.sy = p.y; n.depth = p.depth; n.persp = p.persp;
  }

  const emoFillCache = new Map();
  function starFill(hue) {
    let s = emoFillCache.get(hue);
    if (!s) { s = 'hsla(' + hue + ', 85%, 86%, 1)'; emoFillCache.set(hue, s); }
    return s;
  }
  function legacyProjectInto(n) {
    const cyw = Math.cos(cam.yaw), syw = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const x1 = n.x * cyw - n.y * syw;
    const y1 = n.x * syw + n.y * cyw;
    const y2 = y1 * cp - n.z * sp;
    const z2 = y1 * sp + n.z * cp;
    const depth = cam.dist - z2;
    if (depth < 80) { n.on = 0; return; }
    const persp = FOCAL / depth;
    n.on = 1; n.sx = W / 2 + x1 * persp; n.sy = H / 2 - y2 * persp; n.depth = depth; n.persp = persp;
  }

  function buildNodes() {
    const mems = (DATA && DATA.memories) || [];
    nodes = mems.map((m) => {
      let seed = 0;
      const key = (m.k && m.k[0]) || m.c.slice(0, 4);
      for (let j = 0; j < key.length; j++) seed = (seed * 31 + key.charCodeAt(j)) >>> 0;
      const wedge = (seed % 1000) / 1000 * Math.PI * 2;
      const rBase = m.core ? 0.14 : m.loop ? 0.34 : 0.44;
      const jitter = ((seed >> 5) % 100) / 100;
      const r = WORLD_R * (rBase + (1 - m.fr) * 0.52 + jitter * 0.14);
      const zSpread = 86;
      const z = (((seed >> 11) % 1000) / 1000 - 0.5) * 2 * zSpread * (m.core ? 0.45 : 1);
      let wx = Math.cos(wedge) * r, wy = Math.sin(wedge) * r, wz = z;
      const paper = !!m.noteText;
      if (m.wish) {
        const wa = -0.35 + (((seed >> 3) % 1000) / 1000) * 1.07;
        const wr = WORLD_R * (0.55 + (((seed >> 7) % 100) / 100) * 0.34);
        wx = Math.cos(wa) * wr; wy = Math.sin(wa) * wr;
        wz = (((seed >> 13) % 100) / 100 - 0.5) * 56;
      }
      if (paper) {
        const pa = ((seed >> 3) % 1000) / 1000 * Math.PI * 2;
        const pr2 = WORLD_R * (0.10 + (((seed >> 9) % 100) / 100) * 0.16);
        wx = Math.cos(pa) * pr2; wy = Math.sin(pa) * pr2;
        wz = (((seed >> 15) % 100) / 100 - 0.5) * 40;
      }
      const imp = Math.max(1, Math.min(5, Number(m.imp) || 3));
      const warm = !!m.core || imp >= 5;   // 暖金只留给核心与最高重要度
      const weight = Math.max(0, Math.min(1, (m.fr || 0) * 0.55 + imp / 8 + (m.core ? .22 : 0)));
      return {
        m,
        x: wx, y: wy, z: wz,
        // 重要性分大小：普通星 1.5~3，重要星 4~6.6，核心再放大一档
        size: (1.2 + imp * 0.58 + (m.core ? 1.5 : 0) + (m.fr || 0) * 1.1),
        core: !!m.core, loop: !!m.loop, wish: !!m.wish, paper,
        warm, weight,
        noteText: m.noteText || '',
        tw: (seed % 628) / 100,
        on: 0, sx: 0, sy: 0, depth: 0, persp: 0
      };
    });
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    // —— 帧首复位：杜绝任何浏览器跨帧状态泄漏 ——
    ctx.globalAlpha = 1;
    ctx.setLineDash([]);
    ctx.textAlign = 'left';
    ctx.lineWidth = 1;
    // —— 恒等变换下的硬清屏：不透明墨水铺满物理像素，杜绝局部残影 ——
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#01030a';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();
    buildBg();
    ctx.drawImage(bgLayer, 0, 0, W, H);
    try { window.__dbg.bg++; } catch {}
    const cx = W / 2, cy = H / 2;

    // —— 心愿区：虚线扇形边界 + 区名 ——
    if (hasWish) {
      ctx.lineWidth = 1;
      for (const br of [0.56, 0.92]) {
        ctx.beginPath();
        let started = false;
        for (let a = -0.35; a <= 0.72; a += 0.06) {
          const p = proj(Math.cos(a) * WORLD_R * br, Math.sin(a) * WORLD_R * br, 0);
          if (!p.on) { started = false; continue; }
          if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = 'rgba(255,232,163,.18)';
        ctx.setLineDash([3, 7]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      for (const a of [-0.35, 0.72]) {
        const p1 = proj(Math.cos(a) * WORLD_R * 0.56, Math.sin(a) * WORLD_R * 0.56, 0);
        const p2 = proj(Math.cos(a) * WORLD_R * 0.92, Math.sin(a) * WORLD_R * 0.92, 0);
        if (p1.on && p2.on) {
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = 'rgba(255,232,163,.18)';
          ctx.setLineDash([3, 7]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
      const lp = proj(Math.cos(0.18) * WORLD_R, Math.sin(0.18) * WORLD_R, 0);
      if (lp.on) {
        ctx.fillStyle = 'rgba(255,232,163,.38)';
        ctx.font = '600 10px "PingFang SC", "Noto Sans CJK SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('心 愿 · 以后想去的地方', lp.x, lp.y);
        ctx.textAlign = 'left';
      }
    }

    const energy = DATA ? (DATA.self.energy || 50) : 50;
    // 慢呼吸：约 9 秒一轮，幅度压小
    const pulse = 9 + 1.8 * Math.sin(t / 1450) + energy * 0.05;

    if (!dragActive) {
      cam.yaw += inertia.yaw; cam.pitch = clamp(cam.pitch + inertia.pitch, -PITCH_MAX, PITCH_MAX);
      inertia.yaw *= 0.94; inertia.pitch *= 0.94;
      if (autoSpin) cam.yaw += 0.000055;  // 极慢自转
    }

    for (const n of nodes) projectInto(n);

    // —— 丝线层：权重决定粗细/透明度，弱连线稳定在 ~0.2，流动粒子极慢 ——
    const corePr = FOCAL / cam.dist;
    for (const n of nodes) {
      if (!n.on) continue;
      if (!n.core && n.persp / corePr < 0.55 && n.m.fr < 0.08) continue;
      const pr = clamp(n.persp / corePr, 0.3, 1.5);
      const w = n.weight;
      // 弱线约 0.20，强线最高 0.55（不刺眼）
      const alpha = clamp(0.19 + w * 0.30, 0.18, 0.50) * clamp(pr, 0.55, 1.05);
      const lineW = (0.3 + w * 1.05) * pr;
      const mxp = (n.sx + cx) / 2 + Math.sin(t / 8600 + n.tw) * 4;
      const myp = (n.sy + cy) / 2 + Math.cos(t / 9800 + n.tw * 1.7) * 4;
      ctx.beginPath();
      ctx.moveTo(n.sx, n.sy);
      ctx.quadraticCurveTo(mxp, myp, cx, cy);
      ctx.strokeStyle = n.warm ? PAL.filaWarm : PAL.filaCool;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = lineW;
      ctx.stroke();

      // 流动粒子：约 18 秒走完一条丝线，且只有中强线才明显
      const p = ((t / 18000) + n.tw % 1 + 1) % 1;
      const qx = (1 - p) * (1 - p) * n.sx + 2 * (1 - p) * p * mxp + p * p * cx;
      const qy = (1 - p) * (1 - p) * n.sy + 2 * (1 - p) * p * myp + p * p * cy;
      ctx.fillStyle = n.warm ? PAL.dotWarm : PAL.dotCool;
      ctx.globalAlpha = (0.18 + w * 0.30) * pr * (1 - p * 0.25);
      ctx.beginPath(); ctx.arc(qx, qy, (0.5 + w * 0.9) * pr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // —— 节点层：画家算法（复用数组）——
    _vis.length = 0; _behind.length = 0; _front.length = 0; _paper.length = 0;
    for (const n of nodes) {
      if (!n.on) continue;
      _vis.push(n);
      if (n.paper) _paper.push(n);
      else (n.depth > cam.dist ? _behind : _front).push(n);
    }
    _behind.sort(byDepthDesc); _front.sort(byDepthDesc);

    const drawPaper = (n, t) => {
      const pr = clamp(n.persp / corePr, 0.5, 1.4);
      const bob = Math.sin(t / 3200 + n.tw) * 1.1;
      const spr = glowSprite(45, 75);
      const gr = 10 * pr;
      ctx.globalAlpha = 0.36;
      ctx.drawImage(spr, n.sx - gr, n.sy - gr, gr * 2, gr * 2);
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(n.sx, n.sy + bob);
      ctx.rotate(Math.sin(t / 5200 + n.tw) * 0.06);
      const sz = 6.5 * pr;
      ctx.fillStyle = 'rgba(255,212,59,.95)';
      ctx.fillRect(-sz, -sz, sz * 2, sz * 2);
      ctx.fillStyle = 'rgba(212,167,31,.85)';
      ctx.beginPath(); ctx.moveTo(-sz, -sz); ctx.lineTo(-sz + sz * 0.55, -sz); ctx.lineTo(-sz, -sz + sz * 0.55); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.7)';
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-sz, -sz, sz * 2, sz * 2);
      ctx.strokeStyle = 'rgba(120,96,20,.55)';
      ctx.beginPath(); ctx.moveTo(-sz * 0.55, -sz * 0.15); ctx.lineTo(sz * 0.55, -sz * 0.15);
      ctx.moveTo(-sz * 0.55, sz * 0.35); ctx.lineTo(sz * 0.25, sz * 0.35); ctx.stroke();
      ctx.restore();
    };

    const drawNode = (n) => {
      if (n.paper) return;
      // 慢呼吸：约 8 秒一轮，幅度低，不闪烁
      const breath = 0.82 + 0.18 * Math.sin(t / 1250 + n.tw);
      const pr = clamp(n.persp / corePr, 0.35, 1.5);
      const size = n.size * pr;
      const w = n.weight;
      const alpha = clamp((0.22 + w * 0.72) * breath * clamp(pr, 0.45, 1.1), 0.10, 1);

      if (n.loop) {
        const slow = Math.sin(t / 2600 + n.tw);
        const rr = (2.0 + Math.max(0, slow) * 0.9 + size * 0.55) * pr;
        ctx.globalAlpha = 0.38 + 0.18 * slow;
        ctx.strokeStyle = PAL.spike;
        ctx.lineWidth = 0.9 * pr;
        ctx.beginPath();
        for (let s = 0; s < 4; s++) {
          const a = s * Math.PI / 2 + t / 12000;
          ctx.moveTo(n.sx, n.sy);
          ctx.lineTo(n.sx + Math.cos(a) * rr * 2.2, n.sy + Math.sin(a) * rr * 2.2);
        }
        ctx.stroke();
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = PAL.spikeCore;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, 1.4 * pr, 0, Math.PI * 2); ctx.fill();
        return;
      }

      // 重要节点暖金，普通节点冷蓝；情绪只做轻微色相偏移
      let hue;
      if (n.warm) hue = 38;                       // 暖金
      else if (n.m.wish) hue = 48;                // 心愿偏浅金
      else hue = ({ joy: 36, miss: 248, heavy: 226, anger: 6, calm: 205 })[n.m.emo || 'calm'] || 205;
      const sat = n.warm ? 80 : 52;

      const spr = glowSprite(hue, sat);
      // 核心节点：更宽的呼吸光晕（约 7 秒一轮）
      if (n.core) {
        const halo = 0.72 + 0.28 * Math.sin(t / 1100 + n.tw);
        const hgr = size * (4.6 + halo * 0.9);
        ctx.globalAlpha = 0.16 + 0.14 * halo;
        ctx.drawImage(spr, n.sx - hgr, n.sy - hgr, hgr * 2, hgr * 2);
      }
      const gr = size * (n.warm ? 3.1 : 2.6);
      ctx.globalAlpha = clamp(alpha * (n.warm ? 1.0 : 0.70), 0, 1);
      ctx.drawImage(spr, n.sx - gr, n.sy - gr, gr * 2, gr * 2);

      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.fillStyle = starFill(hue);
      ctx.beginPath(); ctx.arc(n.sx, n.sy, Math.max(0.5, size * (n.warm ? 0.46 : 0.40)), 0, Math.PI * 2); ctx.fill();

      if (n.core) {
        // 白环 + 慢涟漪
        ctx.globalAlpha = 0.26 * breath;
        ctx.strokeStyle = 'rgba(255,245,222,.85)';
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, size * 1.9, 0, Math.PI * 2); ctx.stroke();
        const rip = (t / 9000 + n.tw * 0.12) % 1;
        ctx.globalAlpha = (1 - rip) * 0.18;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, size * (1.9 + rip * 1.8), 0, Math.PI * 2); ctx.stroke();
      }
      if (rehearsedPfx.some(p => n.m.c.startsWith(p))) {
        ctx.globalAlpha = 0.26 + 0.12 * Math.sin(t / 2600 + n.tw);
        ctx.strokeStyle = 'rgba(255,255,255,.75)';
        ctx.setLineDash([2.5, 5]);
        ctx.lineWidth = 0.75;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, size * 2.6, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
    };

    for (const n of _behind) drawNode(n);

    const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulse * 2.8);
    core.addColorStop(0, 'hsla(' + moodTint.hue + ', 82%, 82%, .78)');
    core.addColorStop(0.38, 'hsla(' + moodTint.hue + ', 72%, 62%, .34)');
    core.addColorStop(1, 'rgba(4,7,15,0)');
    ctx.fillStyle = core;
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(cx, cy, pulse * 2.8, 0, Math.PI * 2); ctx.fill();
    // 中心慢涟漪：约 11 秒一圈，只一圈、极淡
    const rip = (t / 11000) % 1;
    ctx.globalAlpha = (1 - rip) * 0.12;
    ctx.strokeStyle = 'hsla(' + moodTint.hue + ', 80%, 85%, .7)';
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(cx, cy, pulse * (1.8 + rip * 2.2), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(240,250,255,.86)';
    ctx.beginPath(); ctx.arc(cx, cy, 2.8 + energy * 0.014, 0, Math.PI * 2); ctx.fill();

    for (const n of _front) drawNode(n);
    for (const n of _paper) { drawPaper(n, t); try { window.__dbg.paper++; } catch {} }
    ctx.globalAlpha = 1;

    // ===== 悬停（拖动中不显示；内容只在目标变化时重建，位置每帧跟随）=====
    let hover = null, hoverCore = false;
    if (!dragActive) {
      const d2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
      if (d2(mouse.x, mouse.y, cx, cy) < Math.pow(Math.max(30, pulse * 2.6), 2)) hoverCore = true;
      if (!hoverCore) {
        for (const n of _vis) {
          if (d2(mouse.x, mouse.y, n.sx, n.sy) < 26 * 26) { hover = n; break; }
        }
      }
    }
    if (hoverCore || hover) {
      tip.style.opacity = 1;
      let html;
      if (hoverCore) {
        const s = DATA ? DATA.self : null;
        tip.style.left = Math.min(W - 264, cx + 20) + 'px';
        tip.style.top = Math.max(8, cy - 40) + 'px';
        html = '<b style="color:#6fd6e8">AI · 此刻</b><br>正在：' + (s ? s.activity : '…') + '<br><span style="color:rgba(223,233,245,.55);font-size:11px">心情：' + (s ? s.mood : '—') + '</span>';
      } else if (hover.paper) {
        tip.style.left = Math.min(W - 264, hover.sx + 16) + 'px';
        tip.style.top = Math.max(8, hover.sy - 14) + 'px';
        html = '<b style="color:#ffd43b">AI偷偷留的小纸条</b>'
          + '<div style="margin:6px 0 2px;padding:8px 10px;background:#fff3bf;color:#5c4400;border-radius:6px;transform:rotate(-1.2deg);font-size:11px;line-height:1.6">'
          + hover.noteText + '<div style="text-align:right;color:#a07c1f;margin-top:4px">— AI 留</div></div>';
      } else {
        tip.style.left = Math.min(W - 260, hover.sx + 16) + 'px';
        tip.style.top = Math.max(8, hover.sy - 14) + 'px';
        const d = new Date(hover.m.t);
        const tstr = (d.getMonth() + 1) + '月' + d.getDate() + '日';
        html = (hover.loop
          ? '<b style="color:#ff7a60">未完成的约定</b><br>'
          : hover.core
            ? '<b style="color:#ffc98a">核心烙印</b><br>'
            : '<b style="color:#6fd6e8">' + ((hover.m.k && hover.m.k.join(' · ')) || '记忆') + '</b><br>')
          + hover.m.c + '<br><span style="color:rgba(223,233,245,.45);font-size:10px">' + tstr + ' · 新鲜度 ' + (hover.m.fr * 100).toFixed(0) + '%</span>';
      }
      const sig = hoverCore ? 'core' : (hover.paper ? 'paper:' + hover.m.t : hover.m.c);
      if (tip.dataset.sig !== sig) {
        tip.innerHTML = html;
        tip.dataset.sig = sig;
      }
    } else if (tip.dataset.sig !== '') {
      tip.dataset.sig = '';
      tip.style.opacity = 0;
    }
    // 注意：帧调度由底部唯一的 rAF 循环负责，这里绝不能再排下一帧
  }

  function setBars() {
    const s = DATA.self;
    document.getElementById('activity').textContent = s.activity;
    document.getElementById('mood').textContent = '心情：' + (s.mood || '—');
    const set = (idb, idv, val) => {
      document.getElementById(idb).style.width = Math.max(0, Math.min(100, val)) + '%';
      document.getElementById(idv).textContent = Math.round(val);
    };
    set('bEnergy', 'vEnergy', s.energy);
    set('bAff', 'vAff', s.affection);
    set('bPout', 'vPout', s.pout);
    document.getElementById('monoText').textContent = s.monologue || '…';
    const mins = Math.floor((Date.now() - (s.lastInteractAt || Date.now())) / 60000);
    document.getElementById('upt').textContent = mins < 1 ? '刚刚在跟你说话' : '距上次互动 ' + (mins < 60 ? mins + ' 分钟' : Math.floor(mins / 60) + ' 小时') + '前';
    const chat = document.getElementById('chat');
    chat.innerHTML = '';
    for (const h of (DATA.history || [])) {
      const d = document.createElement('div');
      d.className = h.r === '他' ? 'him' : '';
      d.textContent = (h.r === 'owner' ? '主人：' : 'AI：') + h.t;
      chat.appendChild(d);
    }
    moodTint = tintForMood(s.mood, s.pout);
    rebuildPalette();
    hasWish = (DATA.memories || []).some(m => m.wish);
    bgHue = -1;  // 心情变了，背景层下一帧自动重铺

    // 欠账台账渲染
    const lp = DATA.loops || [];
    const lb = document.getElementById('loopsBox');
    if (lp.length) {
      lb.style.display = 'block';
      const el = document.getElementById('loopsList');
      el.innerHTML = '';
      for (const l of lp.slice(0, 6)) {
        const d = document.createElement('div');
        d.textContent = '• ' + l.t + (l.esc ? ' 〔加急〕' : '') + '（欠' + l.days + '天）';
        el.appendChild(d);
      }
    } else {
      lb.style.display = 'none';
    }
    // 夜巡回光的星星前缀（画虚线回光环）
    rehearsedPfx = (DATA.rehearsed || []).map(c => String(c).slice(0, 16));
  }

  async function poll() {
    try {
      const r = await fetch('data/snapshot.json?_=' + Date.now(), { cache: 'no-store' });
      if (r.ok) {
        DATA = await r.json();
        buildNodes(); setBars();
      }
    } catch (e) { /* 静默重试 */ }
  }

  // ===== 交互 =====
  const pointers = new Map();
  let lastPinch = 0, lastTap = 0, moved = 0;
  let touchTimer = null;

  cv.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) { moved = 0; dragActive = true; lastPinch = 0; cv.classList.add('drag'); }
  });

  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) {
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
      return;
    }
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 1) {
      moved += Math.abs(dx) + Math.abs(dy);
      cam.yaw += dx * 0.0026;
      cam.pitch = clamp(cam.pitch - dy * 0.0026, -PITCH_MAX, PITCH_MAX);
      inertia.yaw = clamp(dx * 0.0026, -0.02, 0.02);
      inertia.pitch = clamp(-dy * 0.0026, -0.016, 0.016);
      mouse.x = -1e4; mouse.y = -1e4;
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (lastPinch > 0) cam.dist = clamp(cam.dist * (lastPinch / dist), DIST_MIN, DIST_MAX);
      lastPinch = dist;
      mouse.x = -1e4; mouse.y = -1e4;
    }
  });

  const endPointer = e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      dragActive = false; lastPinch = 0; cv.classList.remove('drag');
      if (moved < 8) {
        mouse.x = e.clientX; mouse.y = e.clientY;
        if (touchTimer) clearTimeout(touchTimer);
        const now = Date.now();
        if (now - lastTap < 320) { resetView(); mouse.x = -1e4; mouse.y = -1e4; }
        lastTap = now;
        touchTimer = setTimeout(() => { mouse.x = -1e4; mouse.y = -1e4; }, 4200);
      } else {
        mouse.x = -1e4; mouse.y = -1e4;
      }
    }
  };
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', () => { if (pointers.size === 0) { mouse.x = -1e4; mouse.y = -1e4; } });

  function resetView() { cam.pitch = -0.34; cam.dist = 1150; inertia.yaw = 0; inertia.pitch = 0; }

  window.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = clamp(cam.dist * Math.exp(clamp(e.deltaY, -240, 240) * 0.0012), DIST_MIN, DIST_MAX);
  }, { passive: false });

  window.addEventListener('dblclick', () => resetView());

  resize();
  // 自适应分辨率：帧耗时连续偏高（>24ms）时自动降渲染精度，低配设备/发热降频时保平滑
  function applyDPR(d) {
    DPR = d;
    try { window.__dpr = DPR; } catch {}
    resize();
  }
  let ftAcc = 0, ftN = 0, lastT = 0;
  try { window.__dbg = { frames: 0, bg: 0, paper: 0 }; } catch {}
  requestAnimationFrame(function loop(t) {
    try { window.__dbg.frames++; } catch {}
    if (lastT) {
      ftAcc += (t - lastT); ftN++;
      if (ftAcc > 1200 && ftN > 3) {
        if (ftAcc / ftN > 24 && DPR > 1) applyDPR(Math.max(1, Math.round((DPR - 0.25) * 100) / 100));
        ftAcc = 0; ftN = 0;
      }
    }
    lastT = t;
    draw(t);
    requestAnimationFrame(loop);
  });

  const spinBtn = document.getElementById('spinBtn');
  function applySpinLabel() { spinBtn.textContent = autoSpin ? '自转 · 开' : '自转 · 停'; }
  applySpinLabel();
  spinBtn.addEventListener('click', () => {
    autoSpin = !autoSpin;
    try { localStorage.setItem('shihai-spin', autoSpin ? 'on' : 'off'); } catch {}
    applySpinLabel();
  });

  poll();
  setInterval(poll, 30000);

  // ═══ 实时心跳：5 秒轮询 live.json，驱动 NOW 卡与今日足迹 ═══
  let live = null;
  function renderLive() {
    const nows = (live && live.now) || {};
    if (!nows.ts) return;
    const age = Math.floor((Date.now() - nows.ts) / 1000);
    const phase = String(nows.phase || '');
    const settled = /^(idle|待机|回复主人|完工|淘到好片|推草稿)$/i.test(phase);
    const idle = phase === 'idle' || phase === '待机' || (settled && age > 120);
    const stale = !settled && !idle && age > 300;
    const box = document.getElementById('nowBox');
    document.getElementById('nowPhase').textContent = (phase === 'idle' || phase === '待机') ? '待机中' : phase;
    document.getElementById('nowDetail').textContent = nows.detail || '';
    document.getElementById('nowAge').textContent = (idle ? '上次心跳 ' : '心跳 ') + (age < 60 ? age + ' 秒前' : Math.round(age / 60) + ' 分钟前');
    box.classList.toggle('idle', idle);
    box.classList.toggle('warn', stale);
    box.title = stale ? '超过 5 分钟没有新事件——可能在憋大招，也可能卡住了' : '';
    const tlBox = document.getElementById('tlBox');
    const tl = document.getElementById('tlList');
    const recent = (live && live.recent) || [];
    if (tlBox && tl) {
      if (recent.length) {
        tlBox.style.display = 'block';
        tl.innerHTML = '';
        for (const ev of recent.slice(0, 7)) {
          const dt = new Date(ev.t);
          const hm = String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
          const d = document.createElement('div');
          d.className = 'ev';
          const b = document.createElement('b');
          b.textContent = hm + ' ' + (ev.phase || '');
          d.appendChild(b);
          d.appendChild(document.createTextNode(' · ' + (ev.d || '')));
          tl.appendChild(d);
        }
      } else {
        tlBox.style.display = 'none';
      }
    }
  }
  async function pollLive() {
    try {
      const r = await fetch('data/live.json?_=' + Date.now(), { cache: 'no-store' });
      if (r.ok) { live = await r.json(); renderLive(); }
    } catch {}
  }
  pollLive();
  setInterval(pollLive, 5000);
})();
</script>
</body>
</html>
